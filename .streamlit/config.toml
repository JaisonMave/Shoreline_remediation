# Dashboard theme (V5.1 design foundation; replaces the D40 light/dark pair). Dark only.
# The colours are the CLAUDE.md palette and must match PALETTE in src/shoreline_remediation/ui_theme.py
# (tests/test_ui_theme.py checks this). The printable HTML report keeps its own light styling.
[theme]
base = "dark"
primaryColor = "#28B8A5"
backgroundColor = "#080D17"
secondaryBackgroundColor = "#111A29"
textColor = "#F4F7FA"
linkColor = "#4E9BE8"
borderColor = "#26344D"
baseRadius = "0.75rem"
font = "sans-serif"
chartCategoricalColors = ["#56B4E9", "#E69F00", "#009E73", "#CC79A7", "#0072B2", "#D55E00"]

[theme.sidebar]
backgroundColor = "#111A29"
secondaryBackgroundColor = "#182438"
